<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Explorer Pro</title>
    
    <link rel="icon" type="image/png" href="app-icon.png" />
    <link rel="apple-touch-icon" href="app-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#4A5568" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        :root {
            --bg-cream: #F7FAFC; 
            --text-main: #1A202C; 
            --text-muted: #4A5568; 
            --sage-green: #38B2AC; 
            --slate-blue: #2B6CB0; 
            --soft-peach: #ED8936; 
            --card-bg: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.08);
            --border-light: 2px solid #E2E8F0;
            --border-radius: 12px;
            --danger-red: #E53E3E;
        }

        body { 
            background-color: var(--bg-cream); 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 20px 20px 40px 20px; 
            position: relative; 
            font-size: 18px; 
        }
        
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* LOGIN & MODALS */
        #loginOverlay, #levelUpModal, #historyModal { 
            position: fixed; inset: 0; background: rgba(247, 250, 252, 0.95); 
            z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px);
        }
        #levelUpModal, #historyModal { display: none; z-index: 10000; }
        .login-card { 
            background: var(--card-bg); border: var(--border-light); border-radius: var(--border-radius); 
            padding: 50px 40px; width: 100%; max-width: 450px; box-shadow: var(--shadow-soft); text-align: center; 
        }
        
        header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 25px; margin-bottom: 25px; flex-wrap: wrap; gap: 20px; border-bottom: var(--border-light); }
        h1 { font-size: 2.4em; font-weight: 900; color: var(--slate-blue); letter-spacing: -0.5px; }
        
        /* ENHANCED TAB NAVIGATION */
        .nav-tabs { display: flex; gap: 12px; flex-wrap: wrap; }
        .tab-btn { 
            background: #EDF2F7; border: 2px solid #CBD5E0; padding: 14px 24px; 
            font-weight: 800; font-size: 1.05em; border-radius: 12px; 
            cursor: pointer; transition: all 0.2s ease; color: var(--text-muted);
        }
        .tab-btn:hover { background: #E2E8F0; color: var(--text-main); border-color: var(--slate-blue); }
        .tab-btn.active { background: var(--slate-blue); border-color: var(--slate-blue); color: #fff; box-shadow: 0 4px 15px rgba(43, 108, 176, 0.3); }

        .stats-bar { 
            display: flex; gap: 25px; background: var(--card-bg); border: var(--border-light); padding: 15px 25px; 
            border-radius: 30px; box-shadow: var(--shadow-soft); margin-bottom: 25px; font-weight: 700; align-items: center; flex-wrap: wrap; font-size: 1.05em;
        }
        .stat-badge { background: var(--bg-cream); padding: 6px 16px; border-radius: 20px; font-size: 0.95em; font-weight: 900; color: var(--sage-green); border: 2px solid #E2E8F0; }
        
        .floating-xp { position: absolute; font-weight: 900; font-size: 1.8em; color: var(--sage-green); pointer-events: none; animation: floatUp 1.2s ease-out forwards; z-index: 1000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.1); } }

        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .search-bar { 
            width: 100%; padding: 20px 25px; font-size: 1.2em; font-weight: 500; border: 2px solid #CBD5E0; 
            border-radius: 30px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.02); outline: none; background: #fff; transition: all 0.3s; color: var(--text-main);
        }
        .search-bar:focus { border-color: var(--slate-blue); box-shadow: 0 0 0 4px rgba(43, 108, 176, 0.15); }
        .search-bar::placeholder { color: #A0AEC0; }
        
        .filter-row { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .level-select { 
            padding: 15px 20px; border-radius: 30px; border: 2px solid #CBD5E0; background: #fff; 
            color: var(--text-main); font-weight: 700; outline: none; cursor: pointer; font-size: 1.05em;
        }

        .btn-action { 
            background: var(--sage-green); color: white; border: none; padding: 18px 35px; font-size: 1.1em; 
            font-weight: 700; border-radius: 30px; box-shadow: 0 4px 15px rgba(56, 178, 172, 0.3); cursor: pointer; transition: all 0.2s; 
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 178, 172, 0.4); }
        .btn-action:active { transform: translateY(1px); }

        .card { background: var(--card-bg); border: var(--border-light); border-radius: var(--border-radius); padding: 40px; box-shadow: var(--shadow-soft); margin-bottom: 25px; }
        
        /* OUTPUT TABS */
        .output-nav { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--border-light); padding-bottom: 10px; overflow-x: auto; }
        .output-tab { background: none; border: none; font-size: 1.15em; font-weight: 700; color: var(--text-muted); cursor: pointer; padding: 8px 15px; transition: 0.2s; white-space: nowrap; }
        .output-tab:hover { color: var(--text-main); }
        .output-tab.active { color: var(--slate-blue); border-bottom: 4px solid var(--slate-blue); }
        
        .output-section { display: none; animation: fadeIn 0.3s ease; }
        .output-section.active { display: block; }
        .discover-section { display: none; animation: fadeIn 0.3s ease; }
        .discover-section.active { display: block; }

        /* ENHANCED TYPOGRAPHY FOR READABILITY */
        .markdown-body { font-size: 1.15em; line-height: 1.8; color: var(--text-main); }
        .markdown-body p { margin-bottom: 1.5em; }
        .markdown-body ul, .markdown-body ol { margin-bottom: 1.5em; margin-left: 25px; }
        .markdown-body li { margin-bottom: 0.8em; }
        .markdown-body strong { color: var(--slate-blue); font-weight: 800; }
        .persona-intro { color: var(--slate-blue); font-style: italic; font-size: 1.1em; font-weight: 600; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px dashed #CBD5E0; line-height: 1.7;}

        /* FLASHCARDS */
        .flashcard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .flashcard { background: transparent; height: 250px; perspective: 1000px; cursor: pointer; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; 
            padding: 30px; border-radius: var(--border-radius); box-shadow: var(--shadow-soft); 
        }
        .flashcard-front { background: var(--slate-blue); color: #fff; font-weight: 700; font-size: 1.4em; border: none; line-height: 1.4; }
        .flashcard-back { background: #fff; color: var(--text-main); border: var(--border-light); transform: rotateY(180deg); font-size: 1.15em; overflow-y: auto; line-height: 1.5; font-weight: 500; }

        /* MCQ */
        .mcq-question { background: var(--bg-cream); padding: 25px; border: 2px dashed #CBD5E0; border-radius: var(--border-radius); margin-bottom: 25px; }
        .mcq-option { 
            display: block; width: 100%; text-align: left; background: #fff; border: 2px solid #E2E8F0; 
            padding: 18px 25px; margin-top: 15px; border-radius: 12px; font-weight: 500; font-size: 1.1em; cursor: pointer; transition: 0.2s; color: var(--text-main);
        }
        .mcq-option:hover { border-color: var(--slate-blue); background: #EBF8FF; }
        .mcq-option.correct { background: var(--sage-green); color: #fff; border-color: var(--sage-green); font-weight: 700; }
        .mcq-option.wrong { background: var(--danger-red); color: #fff; border-color: var(--danger-red); font-weight: 700;}

        .answer-checker { display: flex; gap: 15px; margin-top: 30px; border-top: var(--border-light); padding-top: 30px; }
        .answer-input { flex-grow: 1; padding: 18px; font-size: 1.2em; font-weight: 700; border: 2px solid #CBD5E0; border-radius: 12px; outline: none; color: var(--text-main); }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        
        .hint-btn { background: #EDF2F7; border: none; padding: 12px 20px; font-weight: 700; color: var(--slate-blue); border-radius: 20px; margin: 5px 10px 5px 0; cursor: pointer; transition: 0.2s; font-size: 0.95em; }
        .hint-btn:hover { background: #E2E8F0; }
        .hint-btn:active:not(:disabled) { transform: translateY(2px); }
        .hint-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .hint-box { background: var(--bg-cream); border-left: 5px solid var(--slate-blue); padding: 18px; margin-top: 15px; font-weight: 500; display: none; font-size: 1.05em; border-radius: 0 8px 8px 0; }

        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-top: 25px; }
        .history-card { 
            background: #fff; border: var(--border-light); padding: 30px; border-radius: var(--border-radius); 
            cursor: pointer; transition: all 0.3s; box-shadow: var(--shadow-soft); position: relative;
        }
        .history-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); border-color: var(--slate-blue); }

        /* TRIVIA HEADER BOX */
        #topTrivia {
            background: var(--slate-blue); color: #fff; padding: 20px 30px; border-radius: var(--border-radius); 
            margin-bottom: 25px; text-align: center; font-weight: 500; font-size: 1.1em; box-shadow: var(--shadow-soft);
            display: none; line-height: 1.6;
        }

        /* MAPS */
        #leafletMap { width: 100%; height: 55vh; min-height: 400px; border: var(--border-light); border-radius: var(--border-radius); margin-top: 20px; z-index: 1; }
        .map-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .map-frame-container { width: 100%; height: 65vh; border: var(--border-light); border-radius: var(--border-radius); overflow: auto; display: none; background: #E2E8F0; }
        .map-frame-container.active { display: block; }
        .zoom-wrapper { width: 100%; height: 100%; transition: all 0.2s ease; transform-origin: top left; }
        .zoom-wrapper iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="margin-bottom: 10px; color: var(--slate-blue); font-weight: 900; font-size: 2.2em;">Geo-Explorer Pro</h2>
            <p style="color: var(--text-muted); margin-bottom: 35px; font-size: 1.1em;">Enter your credentials to access the hub.</p>
            <input type="text" id="usernameInput" class="search-bar" placeholder="Your Name" style="margin-bottom: 20px; text-align: center;">
            <input type="password" id="accessCodeInput" class="search-bar" placeholder="Access Code" style="margin-bottom: 30px; text-align: center;">
            <button class="btn-action" style="width: 100%;" onclick="startSession()">Authenticate</button>
            <div id="loginError" style="color: var(--danger-red); font-weight: 700; margin-top: 20px; font-size: 1em;"></div>
        </div>
    </div>

    <div id="levelUpModal">
        <div class="login-card">
            <h1 style="font-size: 2.8em; margin-bottom: 15px; color: var(--sage-green);">Level Up!</h1>
            <h2 style="color: var(--text-main); margin-bottom: 25px; font-weight: 500;">You are now a <strong id="newRankTitle"></strong></h2>
            <button class="btn-action" onclick="document.getElementById('levelUpModal').style.display='none'">Continue Exploring</button>
        </div>
    </div>

    <div id="historyModal">
        <div class="container" style="background: var(--bg-cream); border: var(--border-light); border-radius: var(--border-radius); padding: 40px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: var(--shadow-soft);">
            <button onclick="document.getElementById('historyModal').style.display='none'" style="position: absolute; top: 20px; right: 20px; background: transparent; color: var(--text-main); border: none; font-size: 1.8em; cursor: pointer; font-weight: 900;">✕</button>
            <h2 id="historyModalTitle" style="margin-bottom: 25px; color: var(--slate-blue); font-size: 1.8em; font-weight: 800;"></h2>
            <div id="historyModalContent"></div>
        </div>
    </div>

    <div class="container">
        <header>
            <div>
                <h1>Geo-Explorer Pro</h1>
                <div id="statusText" style="color: var(--text-muted); font-size: 1em; font-weight: 600; margin-top: 5px;">⏳ Syncing...</div>
            </div>
            
            <!-- REORDERED NAV TABS -->
            <nav class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('curriculum', this)">Hub</button>
                <button class="tab-btn" onclick="switchTab('atlas', this)">Atlas</button>
                <button class="tab-btn" onclick="switchTab('discover', this)">What Others Are Exploring</button>
                <button class="tab-btn" onclick="switchTab('drills', this)">Drills</button>
            </nav>
        </header>

        <!-- TOP TRIVIA BOX -->
        <div id="topTrivia">
            ✨ <span id="triviaText">Loading trivia...</span>
        </div>

        <div class="stats-bar">
            <span>Explorer: <strong id="displayUser" style="color: var(--slate-blue);">-</strong></span>
            <span>Streak: <strong id="statStreak" style="color: var(--soft-peach);">0 Days</strong></span>
            <span>XP: <strong id="statXP" style="color: var(--sage-green);">0</strong></span>
            <div style="margin-left: auto;">
                <span class="stat-badge" id="rankBadge">Tourist</span>
            </div>
        </div>

        <!-- 1. HUB (GUIDED INTENT) -->
        <div id="curriculum" class="screen active">
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <input type="text" id="currSearch" class="search-bar" placeholder="">
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button class="btn-action" style="flex: 1; background: var(--slate-blue);" onclick="generateTriFactor('standard')">Concept (Standard Notes)</button>
                    <button class="btn-action" style="flex: 1;" onclick="generateTriFactor('deepdive', this)">Reasoning (Deep-Dive)</button>
                </div>
            </div>
            <div id="currLoading" style="font-size: 1.2em; font-weight: 700; color: var(--sage-green); margin-top: 30px; display: none; text-align: center;">Consulting Database...</div>
            <div id="currOutput" style="margin-top: 40px;"></div>
        </div>
        
        <!-- 2. ATLAS (MOVED UP) -->
        <div id="atlas" class="screen">
            <div class="card">
                <h2 style="color: var(--slate-blue); margin-bottom: 20px; font-weight: 800; font-size: 1.8em;">Interactive Globe</h2>
                <div style="display: flex; gap: 15px;">
                    <input type="text" id="mapSearchInput" class="search-bar" placeholder="Search location..." onkeypress="if(event.key==='Enter') searchMapLocation()">
                    <button class="btn-action" onclick="searchMapLocation()">Search</button>
                </div>
                <div id="leafletMap"></div>
            </div>
            <div class="card" style="margin-top: 30px;">
                <h2 style="color: var(--sage-green); margin-bottom: 20px; font-weight: 800; font-size: 1.8em;">Reference Maps</h2>
                <div class="map-selector">
                    <button class="tab-btn active" onclick="switchDriveMap('mapIndiaPol', this)">India Political</button>
                    <button class="tab-btn" onclick="switchDriveMap('mapIndiaPhys', this)">India Physical</button>
                    <button class="tab-btn" onclick="switchDriveMap('mapIndiaSoil', this)">India Soils</button>
                    <button class="tab-btn" onclick="switchDriveMap('mapIndiaRivers', this)">India Rivers</button>
                    <button class="tab-btn" onclick="switchDriveMap('mapIndiaMtn', this)">India Mountains</button>
                </div>
                <div class="map-zoom-controls">
                    <button class="hint-btn" onclick="zoomMap(0.5)">Zoom In ➕</button>
                    <button class="hint-btn" onclick="zoomMap(-0.5)">Zoom Out ➖</button>
                    <button class="hint-btn" onclick="resetZoom()">Reset 🔄</button>
                </div>
                <div id="container_mapIndiaPol" class="map-frame-container active"><div id="zoom_mapIndiaPol" class="zoom-wrapper"><iframe src="https://drive.google.com/file/d/1g46BgTXY78P6e0Ks0PdLHrMip5wX5v-x/preview"></iframe></div></div>
                <div id="container_mapIndiaPhys" class="map-frame-container"><div id="zoom_mapIndiaPhys" class="zoom-wrapper"><iframe src="https://drive.google.com/file/d/14BG4y3ZznlZQOWbMSkC9cmhW5isfTlCP/preview"></iframe></div></div>
                <div id="container_mapIndiaSoil" class="map-frame-container"><div id="zoom_mapIndiaSoil" class="zoom-wrapper"><iframe src="https://drive.google.com/file/d/1MqwREOWaUFxs-ikDug5PO24Shw78n374/preview"></iframe></div></div>
                <div id="container_mapIndiaRivers" class="map-frame-container"><div id="zoom_mapIndiaRivers" class="zoom-wrapper"><iframe src="https://drive.google.com/file/d/1ird_daUkDpa7NcivzqKWPmE4o2Ixq1rA/preview"></iframe></div></div>
                <div id="container_mapIndiaMtn" class="map-frame-container"><div id="zoom_mapIndiaMtn" class="zoom-wrapper"><iframe src="https://drive.google.com/file/d/13fHvWHhtJVQpS_wZCkEGsabNGqkOviC7/preview"></iframe></div></div>
            </div>
        </div>

        <!-- 3. WHAT OTHERS ARE EXPLORING -->
        <div id="discover" class="screen">
            <div class="output-nav" style="margin-bottom: 30px;">
                <button class="output-tab active" onclick="switchDiscoverTab('discover_notes', this)">Deep-Dives & Notes</button>
                <button class="output-tab" onclick="switchDiscoverTab('discover_mcqs', this)">Community MCQs</button>
                <button class="output-tab" onclick="switchDiscoverTab('discover_flashcards', this)">Community Flashcards</button>
            </div>

            <div id="discover_notes" class="discover-section active">
                <div class="filter-row">
                    <input type="text" id="historySearchInput" class="search-bar" style="flex-grow: 1;" placeholder="Search community topics..." onkeyup="filterHistory()">
                    <select id="historyLevelFilter" class="level-select" onchange="filterHistory()">
                        <option value="all">All Intents</option>
                        <option value="concept">Concept (Standard)</option>
                        <option value="reasoning">Reasoning (Deep-Dive)</option>
                    </select>
                    <button class="btn-action" style="background: var(--text-main); padding: 15px 25px;" onclick="refreshData()">Sync Data</button>
                </div>
                <div id="historyGrid" class="history-grid"></div>
            </div>

            <div id="discover_mcqs" class="discover-section">
                <div class="filter-row">
                    <input type="text" id="mcqTopicSearch" class="search-bar" style="flex-grow: 1;" placeholder="Search community MCQs..." onkeyup="filterMCQTopics()">
                    <select id="mcqLevelFilter" class="level-select" onchange="filterMCQTopics()">
                        <option value="all">All Intents</option>
                        <option value="concept">Concept (Standard)</option>
                        <option value="reasoning">Reasoning (Deep-Dive)</option>
                    </select>
                    <button class="btn-action" style="background: var(--slate-blue);" onclick="loadNextMCQ(true)">Next MCQ</button>
                </div>
                <div id="mcqContainer"><div class="card">Loading...</div></div>
            </div>

            <div id="discover_flashcards" class="discover-section">
                <div class="filter-row">
                    <input type="text" id="flashcardSearchInput" class="search-bar" style="flex-grow: 1;" placeholder="Search community flashcards..." onkeyup="renderCommunityFlashcards()">
                    <select id="flashcardLevelFilter" class="level-select" onchange="renderCommunityFlashcards()">
                        <option value="all">All Intents</option>
                        <option value="concept">Concept (Standard)</option>
                        <option value="reasoning">Reasoning (Deep-Dive)</option>
                    </select>
                </div>
                <div id="communityFlashcardGrid" class="flashcard-grid"></div>
            </div>
        </div>

        <!-- 4. DRILLS -->
        <div id="drills" class="screen">
            <div class="filter-row">
                <input type="text" id="drillTopicSearch" class="search-bar" style="flex-grow: 1;" placeholder="Search foundational drills..." onkeyup="filterDrillTopics()">
                <button class="btn-action" style="background: var(--slate-blue);" onclick="loadNextDrill(true)">Next Drill</button>
            </div>
            <div id="drillContainer"><div class="card">Loading...</div></div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzOPD3BIEEY780hMhTyVwnXE1RxIQR8Wel953xc1We1-nmN5dawSeVQEws7xY5aCVwlNA/exec";

        var globalData = { drills: [], mcqs: [], facts: [], history: [] };
        
        var GeoGame = {
            user: null, code: null, token: null, xp: 0, streak: 0, rank: "Tourist",
            initProgress: function(prog) {
                this.xp = prog.xp || 0; this.streak = prog.streak || 0; this.rank = prog.rank || "Tourist"; this.updateUI();
            },
            addXP: function(amount, element, isDailyAction) {
                this.xp += amount;
                if (element) {
                    var rect = element.getBoundingClientRect();
                    var floatEl = document.createElement("div");
                    floatEl.className = "floating-xp"; floatEl.innerText = "+" + amount + " XP";
                    floatEl.style.left = (rect.left + window.scrollX + (rect.width/2) - 20) + "px";
                    floatEl.style.top = (rect.top + window.scrollY) + "px";
                    document.body.appendChild(floatEl);
                    setTimeout(function() { floatEl.remove(); }, 1200);
                }
                apiCall('syncUserProgress', { name: GeoGame.user, code: GeoGame.code, addedXP: amount, isDailyAction: isDailyAction })
                    .then(function(res) {
                        GeoGame.streak = res.streak;
                        if (res.rank !== GeoGame.rank) {
                            GeoGame.rank = res.rank;
                            document.getElementById("newRankTitle").innerText = res.rank;
                            document.getElementById("levelUpModal").style.display = "flex";
                        }
                        GeoGame.updateUI();
                    });
            },
            updateUI: function() {
                document.getElementById('statXP').innerText = this.xp;

        var sessionInterval = null, currentDrill = null, currentMCQ = null, hintUsed = false, currentZoom = 1, activeZoomWrapperId = 'zoom_mapIndiaPol', currentHistoryView = [];

        /* TYPING EFFECT FOR HUB SEARCH */
        const searchPrompts = [
            "Explore a concept (e.g., 'Formation of the Himalayas')...",
            "Ask for reasoning (e.g., 'Why do trade winds reverse?')...",
            "Discover mysteries (e.g., 'Why do planets have different moons?')..."
        ];
        let promptIndex = 0, charIndex = 0, isDeleting = false, typingDelay = 60, erasingDelay = 40, newPromptDelay = 2000;
        
        function typeSearchPlaceholder() {
            const inputField = document.getElementById("currSearch");
            if(document.activeElement === inputField) { setTimeout(typeSearchPlaceholder, 1000); return; }
            
            let currentText = searchPrompts[promptIndex];
            if (isDeleting) {
                inputField.setAttribute("placeholder", currentText.substring(0, charIndex - 1));
                charIndex--;
            } else {
                inputField.setAttribute("placeholder", currentText.substring(0, charIndex + 1));
                charIndex++;
            }

            if (!isDeleting && charIndex === currentText.length) {
                isDeleting = true; setTimeout(typeSearchPlaceholder, newPromptDelay);
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false; promptIndex = (promptIndex + 1) % searchPrompts.length; setTimeout(typeSearchPlaceholder, 500);
            } else {
                setTimeout(typeSearchPlaceholder, isDeleting ? erasingDelay : typingDelay);
            }
        }

        async function apiCall(action, params = {}) {
            let url = new URL(GAS_API_URL);
            url.searchParams.append('action', action);
            for (let key in params) { url.searchParams.append(key, params[key]); }
            try {
                let response = await fetch(url, { redirect: "follow" });
                return await response.json();
            } catch (err) { return { success: false, error: "Network error." }; }
        }

        function startSession() {
            var name = document.getElementById('usernameInput').value.trim();
            var code = document.getElementById('accessCodeInput').value.trim();
            var errorEl = document.getElementById('loginError');
            if (!name || !code) {
                errorEl.innerText = "Please enter both credentials."; return;
            }
            errorEl.innerText = "Authenticating...";
            apiCall('validateUserCode', { name: name, code: code }).then(function(data) {
                if (data.success) {
                    GeoGame.user = data.user; GeoGame.code = data.code; GeoGame.token = data.token;
                    localStorage.setItem('geo_user', GeoGame.user); localStorage.setItem('geo_code', GeoGame.code); localStorage.setItem('geo_token', GeoGame.token);
                    document.getElementById('displayUser').innerText = GeoGame.user;
                    document.getElementById('loginOverlay').style.display = 'none';
                    GeoGame.initProgress(data.progress);
                    sessionInterval = setInterval(pollSessionStatus, 10000);
                    init(); typeSearchPlaceholder();
                } else { 
                    errorEl.innerText = data.error || "Authentication failed."; 
                    document.getElementById('loginOverlay').style.display = 'flex';
                }
            });
        }

        function pollSessionStatus() {
            if (!GeoGame.code || !GeoGame.token) return;
            apiCall('checkSessionActive', { username: GeoGame.code, token: GeoGame.token }).then(function(data) {
                if (data && !data.valid) { clearInterval(sessionInterval); alert("⚠️ Session Terminated: Duplicate login detected."); localStorage.clear(); location.reload(); }

        }

        function renderTriFactorUI(markdown, container, mode, isInteractive) {
            try {
                var summaryHTML = "", flashcardsHTML = "", quizHTML = "", rabbitHTML = "";
                var uid = Math.floor(Math.random() * 10000); 
                
                var summaryMatch = markdown.match(/\|\|\|SUMMARY\|\|\|([\s\S]*?)(?=\|\|\|FLASHCARDS\|\|\||\|\|\|QUIZ\|\|\||\|\|\|RABBIT_HOLE\|\|\||$)/i);
                if(summaryMatch && summaryMatch[1]) {
                    var fullText = summaryMatch[1].trim();
                    var bulletIdx = fullText.search(/\n\s*[-*]\s/);
                    var introFluff = "", coreNotes = fullText;
                    if (bulletIdx !== -1) { introFluff = fullText.substring(0, bulletIdx).trim(); coreNotes = fullText.substring(bulletIdx).trim(); } 
                    else if (fullText.indexOf('.') !== -1 && fullText.indexOf('.') < 200) { introFluff = fullText.substring(0, fullText.indexOf('.') + 1).trim(); coreNotes = fullText.substring(fullText.indexOf('.') + 1).trim(); }
                    summaryHTML = (introFluff ? '<div class="persona-intro">' + introFluff + '</div>' : '') + marked.parse(coreNotes);
                }

                var rabbitMatch = markdown.match(/\|\|\|RABBIT_HOLE\|\|\|([\s\S]*?)(?=\|\|\||$)/i);
                if(rabbitMatch && rabbitMatch[1]) rabbitHTML = marked.parse(rabbitMatch[1].trim());

                var flashMatch = markdown.match(/\|\|\|FLASHCARDS\|\|\|([\s\S]*?)(?=\|\|\|QUIZ\|\|\||\|\|\|RABBIT_HOLE\|\|\||$)/i);
                if(flashMatch && flashMatch[1]) {
                    var lines = flashMatch[1].split(/Q:/).filter(l => l.includes('| A:') || l.includes('A:'));
                    var cards = '';
                    for (var i = 0; i < lines.length; i++) {
                        var sides = lines[i].split(/\| A:| A:/);
                        if (sides.length >= 2) cards += '<div class="flashcard" onclick="this.classList.toggle(\'flipped\')"><div class="flashcard-inner"><div class="flashcard-front">' + sides[0].replace(/^\*+/, '').trim() + '</div><div class="flashcard-back">' + sides[1].trim() + '</div></div></div>';
                    }
                    if(cards) flashcardsHTML = '<div class="flashcard-grid">' + cards + '</div>';
                }

                var quizMatch = markdown.match(/\|\|\|QUIZ\|\|\|([\s\S]*?)(?=\|\|\|RABBIT_HOLE\|\|\||$)/i);
                if(quizMatch && quizMatch[1]) {
                    var questions = quizMatch[1].split(/Q:/).filter(q => q.includes('?'));
                    var qListHTML = '';
                    for (var j = 0; j < questions.length; j++) {
                        var qStr = questions[j];
                        var qText = qStr.substring(0, qStr.indexOf('?')).replace(/^\*+/, '').trim() + '?';
                        var optionsPart = qStr.substring(qStr.indexOf('?') + 1);
                        var correctLetter = 'A';
                        if (optionsPart.includes('| Correct:')) {
                            correctLetter = optionsPart.split('| Correct:')[1].trim().charAt(0).toUpperCase();
                            optionsPart = optionsPart.split('| Correct:')[0];
                        }
                        var optA = extractOption(optionsPart, 'A)', 'B)');
                        var optB = extractOption(optionsPart, 'B)', 'C)');
                        var optC = extractOption(optionsPart, 'C)', '');

                        if(optA && optB) {
                            var clickAction = isInteractive ? 'onclick="checkStandardMCQ(this, \'' + correctLetter + '\', \'' : 'style="pointer-events:none;" data-dummy="';
                            qListHTML += '<div class="mcq-question"><h3 style="margin-bottom: 20px; font-weight:800; font-size:1.3em;">' + (j + 1) + '. ' + qText + '</h3>' +
                                '<button class="mcq-option" ' + clickAction + (isInteractive ? 'A' : '') + '\')">A) ' + optA + '</button>' +
                                '<button class="mcq-option" ' + clickAction + (isInteractive ? 'B' : '') + '\')">B) ' + optB + '</button>' +
                                (optC ? '<button class="mcq-option" ' + clickAction + (isInteractive ? 'C' : '') + '\')">C) ' + optC + '</button>' : '') +
                                '</div>';
                        }
                    }
                    if(qListHTML) quizHTML = qListHTML;
                }

                var tabsHTML = '<div class="output-nav">' +
                    '<button class="output-tab active" onclick="switchOutputTab(\'tab_notes_'+uid+'\', this)">Notes</button>' +
                    (flashcardsHTML ? '<button class="output-tab" onclick="switchOutputTab(\'tab_flash_'+uid+'\', this)">Flashcards</button>' : '') +
                    (quizHTML ? '<button class="output-tab" onclick="switchOutputTab(\'tab_quiz_'+uid+'\', this)">Quiz</button>' : '') +
                    (rabbitHTML ? '<button class="output-tab" onclick="switchOutputTab(\'tab_rabbit_'+uid+'\', this)">Deep-Dive</button>' : '') +
                    '</div>';

                var contentHTML = '<div id="tab_notes_'+uid+'" class="output-section markdown-body active">' + summaryHTML + '</div>' +
                                  (flashcardsHTML ? '<div id="tab_flash_'+uid+'" class="output-section">' + flashcardsHTML + '</div>' : '') +
                                  (quizHTML ? '<div id="tab_quiz_'+uid+'" class="output-section">' + quizHTML + '</div>' : '') +
                                  (rabbitHTML ? '<div id="tab_rabbit_'+uid+'" class="output-section markdown-body">' + rabbitHTML + '</div>' : '');

                container.innerHTML = '<div class="card" style="padding:35px;">' + tabsHTML + contentHTML + '</div>';
            } catch (err) { container.innerHTML = "<div class='card markdown-body'><p>Formatting adjusted.</p>" + marked.parse(markdown) + "</div>"; }
        }

        function extractOption(text, startKey, endKey) {
            var startIdx = text.indexOf(startKey);
            if (startIdx === -1) return "Error";
            startIdx += startKey.length;
            var endIdx = endKey ? text.indexOf(endKey) : text.length;
            if (endIdx === -1) endIdx = text.length;
            return text.substring(startIdx, endIdx).trim();
        }

        function checkStandardMCQ(element, correctLetter, guessLetter) {
            var siblings = element.parentElement.querySelectorAll('.mcq-option');
            siblings.forEach(s => s.style.pointerEvents = 'none');
            if(guessLetter === correctLetter) {
                element.classList.add('correct'); GeoGame.addXP(2, element, false);
            } else {
                element.classList.add('wrong');
                siblings.forEach(s => { if(s.innerText.startsWith(correctLetter)) s.classList.add('correct'); });
            }
        }

        function flagCurrentQuestion(btn, type) {
            var qText = type === 'mcq' ? (currentMCQ.question || currentMCQ.q) : (currentDrill.question || currentDrill.q);
            if (!qText) return;
            btn.innerText = "🚩 Flagged"; btn.disabled = true;
            apiCall('flagQuestion', { questionText: qText });
        }

        /* ---------------------------
           COMMUNITY FLASHCARDS
        -----------------------------*/
        function renderCommunityFlashcards() {
            var grid = document.getElementById('communityFlashcardGrid');
            if (!globalData.history || globalData.history.length === 0) { grid.innerHTML = '<div class="card">No flashcards found.</div>'; return; }
            
            var searchTerm = document.getElementById('flashcardSearchInput').value.toLowerCase().trim();
            var levelFilter = document.getElementById('flashcardLevelFilter').value;
            
            var allCards = [];
            
            globalData.history.forEach(function(item) {
                var mockTag = item.mode === 'deepdive' ? "reasoning" : "concept";
                if (levelFilter !== 'all' && mockTag !== levelFilter) return;

                var markdown = item.markdown;
                if(!markdown) return;
                var flashMatch = markdown.match(/\|\|\|FLASHCARDS\|\|\|([\s\S]*?)(?=\|\|\|QUIZ\|\|\||\|\|\|RABBIT_HOLE\|\|\||$)/i);
                if(flashMatch && flashMatch[1]) {
                    var lines = flashMatch[1].split(/Q:/).filter(l => l.includes('| A:') || l.includes('A:'));
                    for (var i = 0; i < lines.length; i++) {
                        var sides = lines[i].split(/\| A:| A:/);
                        if (sides.length >= 2) {
                            var front = sides[0].replace(/^\*+/, '').trim();
                            var back = sides[1].trim();
                            if (searchTerm === '' || front.toLowerCase().includes(searchTerm) || back.toLowerCase().includes(searchTerm)) {
                                allCards.push({ front: front, back: back });
                            }
                        }
                    }
                }
            });
            
            // Alphabetize Flashcards by Front text
            allCards.sort((a, b) => a.front.localeCompare(b.front));
            
            var cardsHTML = '';
            allCards.forEach(c => {
                cardsHTML += '<div class="flashcard" onclick="this.classList.toggle(\'flipped\')"><div class="flashcard-inner"><div class="flashcard-front">' + c.front + '</div><div class="flashcard-back">' + c.back + '</div></div></div>';
            });
            
            grid.innerHTML = cardsHTML || '<div class="card">No flashcards match criteria.</div>';
        }

        /* ---------------------------

        -----------------------------*/
        function filterDrillTopics() { loadNextDrill(false); }

        function loadNextDrill(forceRandom = false) {
            var searchTerm = document.getElementById('drillTopicSearch') ? document.getElementById('drillTopicSearch').value.toLowerCase().trim() : '';
            hintUsed = false; 

            if (globalData.drills.length === 0) { document.getElementById('drillContainer').innerHTML = '<div class="card">Awaiting Data...</div>'; return; }
            var pool = globalData.drills.filter(function(q) {
                var topic = (q.topic || q.category || '').toLowerCase();
                var question = (q.question || q.q || '').toLowerCase();
                return searchTerm === '' || topic.includes(searchTerm) || question.includes(searchTerm);
            });

            var container = document.getElementById('drillContainer');
            if (pool.length === 0) { container.innerHTML = '<div class="card">No drills match this search.</div>'; return; }

            currentDrill = pool[Math.floor(Math.random() * pool.length)];
            var questionText = currentDrill.question || 'Drill Question';
            var answerText = String(currentDrill.answer || 'N/A').trim();
            var topicText = currentDrill.topic || currentDrill.category || 'Drill';
            var qType = String(currentDrill.questiontype || currentDrill.type || '').toLowerCase(); 

            var isTrueFalse = qType.includes('true') || qType.includes('false');
            var drillBadge = isTrueFalse ? '<span class="stat-badge" style="margin-left:15px; border:none; background: var(--text-main); color: #fff;">TRUE / FALSE</span>' : '<span class="stat-badge" style="margin-left:15px; border:none; background: var(--text-main); color: #fff;">FILL IN THE BLANK</span>';

            var flagHTML = '<button class="hint-btn" style="float: right; color: var(--danger-red); padding: 8px 15px; margin: 0;" onclick="flagCurrentQuestion(this, \'drill\')">🚩 Flag</button>';
            var interactionHTML = '';
            
            if (isTrueFalse) {
                interactionHTML = '<div style="display: flex; gap: 15px; margin-top: 30px;"><button class="btn-action" style="flex:1;" onclick="verifyTrueFalse(\'true\', this)">TRUE</button><button class="btn-action" style="flex:1; background:var(--text-muted);" onclick="verifyTrueFalse(\'false\', this)">FALSE</button></div>';
            } else {
                var hint1Text = currentDrill.hint1definition || currentDrill.hint1 || 'No definition available.';
                var hint2Text = currentDrill.hint2tags || currentDrill.hint2 || 'No tags available.';
                var hint3Text = currentDrill.hint3mask || currentDrill.hint3 || 'No mask available.';
                
                interactionHTML = '<div style="margin-bottom: 30px;">' + 
                    '<button class="hint-btn" onclick="revealDrillHint(1)">💡 Definition</button>' +
                    '<button class="hint-btn" id="hbtn2" disabled onclick="revealDrillHint(2)">🏷 Tags</button>' +
                    '<button class="hint-btn" id="hbtn3" disabled onclick="revealDrillHint(3)">🔤 Mask</button>' + 
                    '<div id="hint1" class="hint-box" style="display:none;"><strong>Definition:</strong> ' + hint1Text + '</div>' +
                    '<div id="hint2" class="hint-box" style="display:none;"><strong>Tags:</strong> ' + hint2Text + '</div>' + 
                    '<div id="hint3" class="hint-box" style="display:none;"><strong>Mask:</strong> <code>' + hint3Text + '</code></div></div>' + 
                    '<div class="answer-checker"><input type="text" id="drillInput" class="answer-input" placeholder="Type answer..." onkeypress="if(event.key===\'Enter\') verifyDrillAnswer(this)"><button class="btn-action" onclick="verifyDrillAnswer(this)">Check</button><button class="btn-action" style="background:var(--text-muted);" onclick="forceRevealAnswer()">Reveal</button></div>';
            }

            container.innerHTML = '<div class="card" style="padding:45px;">' + flagHTML + '<span style="font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size:1em;">' + topicText + '</span>' + drillBadge + '<h2 style="margin: 20px 0 30px; color: var(--slate-blue); font-size: 1.7em; font-weight: 800; line-height: 1.4;">' + questionText + '</h2>' + interactionHTML + '<div id="drillFeedback" style="margin-top: 20px; font-weight: 700; font-size: 1.3em;"></div><div id="drillReveal" style="display:none; margin-top: 25px; padding: 25px; background: var(--bg-cream); border-left: 5px solid var(--sage-green); border-radius: 8px;"><h3 style="color: var(--sage-green); margin-bottom: 10px; font-weight:800;">Correct Answer: ' + answerText + '</h3><p style="font-size: 1.1em; color: var(--text-main);">' + (currentDrill.explanation || '') + '</p><button class="btn-action" style="margin-top: 20px;" onclick="loadNextDrill(true)">Next Drill ➡</button></div></div>';
        }

        function revealDrillHint(num) {
            hintUsed = true; 
            document.getElementById('hint' + num).style.display = 'block';
            if (num < 3) document.getElementById('hbtn' + (num+1)).disabled = false;
        }

        function forceRevealAnswer() {
            document.getElementById('drillReveal').style.display = 'block';
            document.getElementById('drillFeedback').innerText = "";
        }

        function verifyTrueFalse(userGuess, btnEl) {
            if (!currentDrill) return;
            var correct = String(currentDrill.answer || '').trim().toLowerCase();
            var fbEl = document.getElementById('drillFeedback');
            var isTrue = correct.includes('true') || correct === 't';
            
            if ((isTrue && userGuess === 'true') || (!isTrue && userGuess === 'false')) {
                fbEl.innerText = "Correct!"; fbEl.style.color = "var(--sage-green)"; 
                if (document.getElementById('drillReveal').style.display !== 'block') { GeoGame.addXP(15, btnEl, true); }
            } else { fbEl.innerText = "Incorrect."; fbEl.style.color = "var(--danger-red)"; }
            forceRevealAnswer();
        }

        function verifyDrillAnswer(btnEl) {
            if (!currentDrill) return;
            var inputEl = document.getElementById('drillInput');
            var fbEl = document.getElementById('drillFeedback');
            var guess = inputEl.value.trim().toLowerCase();
            var correct = String(currentDrill.answer || '').trim().toLowerCase();
            if(!guess) return;

            if (guess === correct || (correct.includes(guess) && guess.length > 3)) {
                inputEl.style.borderColor = "var(--sage-green)";
                fbEl.innerText = "Correct!"; fbEl.style.color = "var(--sage-green)"; 
                if (document.getElementById('drillReveal').style.display !== 'block') { GeoGame.addXP(hintUsed ? 5 : 15, btnEl, true); }
                forceRevealAnswer();
            } else {
                inputEl.classList.add('shake'); setTimeout(function() { inputEl.classList.remove('shake'); }, 400);
                fbEl.innerText = "Incorrect."; fbEl.style.color = "var(--danger-red)";
            }
        }

        /* ---------------------------
           MAP CONTROLS
        -----------------------------*/
        var leafletMap = null;
        var mapMarker = null;
        
        function initLeafletMap() {
            var mapEl = document.getElementById('leafletMap');
            if (!mapEl || mapEl.clientHeight === 0) return; 
            
            if (!leafletMap) {
                leafletMap = L.map('leafletMap').setView([20, 0], 2);
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(leafletMap);
            }
            leafletMap.invalidateSize(); 
        }

        function searchMapLocation() {
            var query = document.getElementById('mapSearchInput').value.trim();
            if (!query) return;
            fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query))
                .then(res => res.json()).then(data => {
                    if (data && data.length > 0) {
                        var lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
                        leafletMap.setView([lat, lon], 8);
                        if (mapMarker) leafletMap.removeLayer(mapMarker);
                        mapMarker = L.marker([lat, lon]).addTo(leafletMap).bindPopup('<b>' + data[0].display_name + '</b>').openPopup();
                    }
                }).catch(e => {});
        }
        
        function switchDriveMap(mapId, btnEl) {
            resetZoom();
            document.querySelectorAll('.map-frame-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.map-selector .tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('container_' + mapId).classList.add('active');
            btnEl.classList.add('active'); activeZoomWrapperId = 'zoom_' + mapId;
        }
        function zoomMap(delta) { currentZoom += delta; if (currentZoom < 1) currentZoom = 1; if (currentZoom > 4) currentZoom = 4; applyZoom(); }
        function resetZoom() { currentZoom = 1; applyZoom(); }
        function applyZoom() {
            var activeWrapper = document.getElementById(activeZoomWrapperId);
            if (activeWrapper) { activeWrapper.style.width = (currentZoom * 100) + '%'; activeWrapper.style.height = (currentZoom * 100) + '%'; }
        }
    </script>
</body>
</html>
